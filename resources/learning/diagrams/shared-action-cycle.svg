<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="动作周期"><rect width="760" height="240" rx="12" fill="#f7f4ed"/><g font-family="Microsoft YaHei, sans-serif" fill="#344e46"><rect x="25" y="70" width="155" height="70" rx="8" fill="#e5eadf" stroke="#8fa397"/><text x="103" y="111" text-anchor="middle" font-size="19">准备位置</text><text x="187" y="112" font-size="22">→</text><rect x="212" y="70" width="155" height="70" rx="8" fill="#e5eadf" stroke="#8fa397"/><text x="290" y="111" text-anchor="middle" font-size="19">接触确认</text><text x="374" y="112" font-size="22">→</text><rect x="399" y="70" width="155" height="70" rx="8" fill="#e5eadf" stroke="#8fa397"/><text x="477" y="111" text-anchor="middle" font-size="19">产生起音</text><text x="561" y="112" font-size="22">→</text><rect x="586" y="70" width="155" height="70" rx="8" fill="#e5eadf" stroke="#8fa397"/><text x="664" y="111" text-anchor="middle" font-size="19">按目标释放</text><text x="30" y="194" font-size="16">下一次准备可以在前音延续时发生；声音结束由音乐目标决定。</text></g></svg>