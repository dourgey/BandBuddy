<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">减法合成：音频路径与控制路径</title>
  <desc id="desc">振荡器和噪声经过混音、滤波器、放大器再到效果与输出；音高、包络和低频振荡器通过独立控制路径改变参数。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#496d64"/></marker></defs>
  <rect width="640" height="420" rx="16" fill="#f7f4ed"/>
  <g font-family="Microsoft YaHei, sans-serif" fill="#39352c" text-anchor="middle">
    <text x="320" y="37" font-size="23" font-weight="bold">声音往前走，控制改变参数</text>
    <g fill="#e5ebe2" stroke="#8fa397"><rect x="30" y="75" width="155" height="62" rx="8"/><rect x="240" y="75" width="155" height="62" rx="8"/><rect x="450" y="75" width="160" height="62" rx="8"/><rect x="450" y="193" width="160" height="62" rx="8"/><rect x="240" y="193" width="155" height="62" rx="8"/><rect x="30" y="193" width="155" height="62" rx="8"/></g>
    <g font-size="20"><text x="107" y="101">振荡器 / 噪声</text><text x="107" y="127" font-size="15">产生原始声音</text><text x="317" y="113">混音器</text><text x="530" y="113">滤波器</text><text x="530" y="231">放大器</text><text x="317" y="231">效果器</text><text x="107" y="231">输出</text></g>
    <g fill="none" stroke="#496d64" stroke-width="3" marker-end="url(#a)"><path d="M185 106H235"/><path d="M395 106H445"/><path d="M530 137V188"/><path d="M450 224H400"/><path d="M240 224H190"/></g>
    <path d="M30 289H610" stroke="#d8d2c5"/>
    <text x="320" y="325" font-size="19">控制路径（不等同于音频）</text>
    <g font-size="17" fill="#496d64"><text x="160" y="363">键盘音高 → 振荡器</text><text x="467" y="363">振幅包络 → 放大器</text><text x="320" y="395">包络 / LFO → 滤波截止频率等目标</text></g>
  </g>
</svg>
