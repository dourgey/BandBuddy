<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title"><title id="title">拾音实验：区域、距离与角度分开比较</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55d7bd"/></marker></defs><rect width="1000" height="520" rx="20" fill="#111923"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#e6edf5;font-size:20px}.small{font-size:16px;fill:#b9c7d6}.title{font-size:26px;font-weight:700}.box{fill:#203244;stroke:#567087;stroke-width:1.5}.flow{fill:none;stroke:#55d7bd;stroke-width:3;marker-end:url(#arrow)}.warn{fill:#ffd08a}</style><text x="36" y="48" class="title">拾音实验：区域、距离与角度分开比较</text><circle cx="238" cy="249" r="122" fill="#273747" stroke="#698094" stroke-width="3"/><circle cx="238" cy="249" r="45" fill="#192431" stroke="#698094" stroke-width="2"/><circle cx="238" cy="249" r="7" fill="#55d7bd"/><circle cx="310" cy="249" r="7" fill="#55d7bd"/><circle cx="347" cy="249" r="7" fill="#55d7bd"/><text x="222" y="226" class="small">中心</text><text x="294" y="226" class="small">中间</text><text x="338" y="286" class="small">边缘</text><text x="98" y="414">扬声器正面：横向比较取样区域</text><rect x="614" y="132" width="24" height="242" rx="6" fill="#567087"/><text x="564" y="112" class="small">声源平面</text><rect x="718" y="220" width="76" height="32" rx="14" fill="#55d7bd"/><path d="M756 252 L756 361" stroke="#9aabba" stroke-width="4"/><path class="flow" d="M711 270 L646 270"/><text x="657" y="307" class="small">距离</text><path d="M804 246 L864 211" stroke="#55d7bd" stroke-width="16" stroke-linecap="round"/><text x="827" y="192" class="small">再改变角度</text><text x="558" y="414">侧面：固定区域后比较距离与角度</text><text x="36" y="470" class="small">固定演奏与监听响度，一次只改变一项。中心常较明亮、边缘常较柔和，实际听感以当前设备为准。</text><text x="36" y="502" class="small">原声琴应比较琴颈连接处、琴桥与音孔附近；此图仅示意电吉他扬声器，不是原声琴布置图。</text></svg>