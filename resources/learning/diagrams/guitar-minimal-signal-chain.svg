<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title"><title id="title">最小声音链：每个接口各有职责</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55d7bd"/></marker></defs><rect width="1000" height="520" rx="20" fill="#111923"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#e6edf5;font-size:20px}.small{font-size:16px;fill:#b9c7d6}.title{font-size:26px;font-weight:700}.box{fill:#203244;stroke:#567087;stroke-width:1.5}.flow{fill:none;stroke:#55d7bd;stroke-width:3;marker-end:url(#arrow)}.warn{fill:#ffd08a}</style><text x="36" y="48" class="title">最小声音链：每个接口各有职责</text><text x="36" y="96">电吉他 · 耳机练习路线</text><rect class="box" x="36" y="118" width="140" height="74" rx="10"/><text x="106.0" y="149" text-anchor="middle">吉他</text><text class="small" x="106.0" y="175" text-anchor="middle">乐器信号</text><rect class="box" x="218" y="118" width="176" height="74" rx="10"/><text x="306.0" y="149" text-anchor="middle">乐器输入</text><text class="small" x="306.0" y="175" text-anchor="middle">接口 / Hi-Z</text><rect class="box" x="436" y="118" width="176" height="74" rx="10"/><text x="524.0" y="149" text-anchor="middle">音箱与箱体</text><text class="small" x="524.0" y="175" text-anchor="middle">先确认模型范围</text><rect class="box" x="654" y="118" width="132" height="74" rx="10"/><text x="720.0" y="149" text-anchor="middle">耳机输出</text><text class="small" x="720.0" y="175" text-anchor="middle">控制监听音量</text><rect class="box" x="828" y="118" width="136" height="74" rx="10"/><text x="896.0" y="149" text-anchor="middle">耳机</text><text class="small" x="896.0" y="175" text-anchor="middle">听处理后信号</text><path class="flow" d="M176 155 L218 155"/><path class="flow" d="M394 155 L436 155"/><path class="flow" d="M612 155 L654 155"/><path class="flow" d="M786 155 L828 155"/><text x="36" y="255">原声吉他 · 按拾音方式选择输入</text><rect class="box" x="36" y="280" width="184" height="74" rx="10"/><text x="128.0" y="311" text-anchor="middle">自然发声</text><text class="small" x="128.0" y="337" text-anchor="middle">不扩声即可练习</text><rect class="box" x="268" y="280" width="208" height="74" rx="10"/><text x="372.0" y="311" text-anchor="middle">话筒 / 琴上拾音</text><text class="small" x="372.0" y="337" text-anchor="middle">两种采集路线</text><rect class="box" x="526" y="280" width="200" height="74" rx="10"/><text x="626.0" y="311" text-anchor="middle">匹配的输入</text><text class="small" x="626.0" y="337" text-anchor="middle">按话筒 / 前级说明</text><rect class="box" x="778" y="280" width="186" height="74" rx="10"/><text x="871.0" y="311" text-anchor="middle">监听或扩声</text><text class="small" x="871.0" y="337" text-anchor="middle">保留清晰与动态</text><path class="flow" d="M476 317 L526 317"/><path class="flow" d="M726 317 L778 317"/><text x="36" y="412" class="small">原声话筒输入与被动拾音器输入的要求不同；高阻不等于高增益。</text><text x="36" y="452" class="warn">Speaker Out 是扬声器输出，不能直接接普通声卡输入或耳机。</text><text x="36" y="488" class="small">图示只描述信号职责，具体端口、电平、负载与供电要求以设备说明为准。</text></svg>