<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title"><title id="title">四线法：把实体前级放入效果链</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55d7bd"/></marker></defs><rect width="1000" height="520" rx="20" fill="#111923"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#e6edf5;font-size:20px}.small{font-size:16px;fill:#b9c7d6}.title{font-size:26px;font-weight:700}.box{fill:#203244;stroke:#567087;stroke-width:1.5}.flow{fill:none;stroke:#55d7bd;stroke-width:3;marker-end:url(#arrow)}.warn{fill:#ffd08a}</style><text x="36" y="48" class="title">四线法：把实体前级放入效果链</text><rect class="box" x="34" y="118" width="162" height="74" rx="10"/><text x="115.0" y="149" text-anchor="middle">吉他</text><text class="small" x="115.0" y="175" text-anchor="middle">① 乐器信号</text><rect class="box" x="296" y="104" width="250" height="74" rx="10"/><text x="421.0" y="135" text-anchor="middle">综合效果器</text><text class="small" x="421.0" y="161" text-anchor="middle">输入 → 前置效果 → Send</text><rect class="box" x="670" y="104" width="288" height="74" rx="10"/><text x="814.0" y="135" text-anchor="middle">音箱前级</text><text class="small" x="814.0" y="161" text-anchor="middle">前面输入 → 前级 → FX Send</text><path class="flow" d="M196 155 L296 155"/><path class="flow" d="M546 141 L670 141"/><text x="224" y="135" class="small">①</text><text x="591" y="120" class="small">②</text><rect class="box" x="296" y="296" width="250" height="74" rx="10"/><text x="421.0" y="327" text-anchor="middle">综合效果器</text><text class="small" x="421.0" y="353" text-anchor="middle">Return → 后置效果 → 主输出</text><rect class="box" x="670" y="296" width="288" height="74" rx="10"/><text x="814.0" y="327" text-anchor="middle">音箱后级</text><text class="small" x="814.0" y="353" text-anchor="middle">FX Return → 后级 → 箱体</text><path class="flow" d="M814 178 L814 236 L421 236 L421 296"/><text x="592" y="223" class="small">③ 音箱 Send 回效果器 Return</text><path class="flow" d="M546 333 L670 333"/><text x="590" y="310" class="small">④</text><text x="36" y="422" class="small">效果器内启用 FX Loop 模块：它的位置代表外部音箱前级在整条链中的位置。</text><text x="36" y="460" class="warn">FX Send / Return 与 Speaker Out 不同；先查电平，再降音量接线。</text><text x="36" y="493" class="small">原声系统通常可用更简单路线；仅在设备与音乐需求适用时采用四线法。</text></svg>