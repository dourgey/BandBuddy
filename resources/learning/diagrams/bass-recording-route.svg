<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="贝斯录音信号路径"><rect width="760" height="240" rx="12" fill="#f7f4ed"/><g font-family="Microsoft YaHei, sans-serif" fill="#344e46"><text x="34" y="49" font-size="18">贝斯 → 合适的乐器输入 / DI → 录入轨</text><path d="M310 65V104H660M310 65V170H660" fill="none" stroke="#8fa397" stroke-width="3"/><text x="326" y="97" font-size="17">直接监听 → 耳机</text><text x="326" y="163" font-size="17">软件处理 → 耳机</text><text x="34" y="220" font-size="16">录入增益与耳机音量分别控制；根据需要选择监听路径。</text></g></svg>