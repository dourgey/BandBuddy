<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BandBuddy 不收集用户的任何隐私信息，所有数据均保存在用户本地设备。">
  <meta name="theme-color" content="#f5f1ea">
  <meta name="color-scheme" content="light">
  <link rel="canonical" href="https://bandbuddy.lonelyme.cn/privacy.html">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>隐私说明 · BandBuddy</title>
</head>
<body>
  <a class="skip-link" href="#privacy-content">跳到隐私说明</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="./" aria-label="BandBuddy 首页">
        <img src="assets/icon.png" width="54" height="54" alt="">
        <span>
          <strong>BandBuddy</strong>
          <small>音乐练习伴侣</small>
        </span>
      </a>
      <nav class="site-nav" aria-label="主要导航">
        <a href="./">返回首页</a>
        <a href="https://github.com/dourgey/BandBuddy" rel="noreferrer">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="shell simple-privacy" id="privacy-content">
    <article>
      <h1>隐私说明</h1>
      <p class="privacy-lead">BandBuddy 不收集、存储或上传用户的任何隐私信息。</p>
      <p>你导入的歌曲、生成的分轨、练习状态和应用设置等数据，全部保存在你的本地设备中，不会上传到 BandBuddy 的服务器。</p>
      <time datetime="2026-08-04">更新日期：2026 年 8 月 4 日</time>
    </article>
  </main>

  <footer class="site-footer privacy-footer">
    <div class="shell footer-inner">
      <nav aria-label="页脚导航">
        <a href="./">首页</a>
        <a href="https://github.com/dourgey/BandBuddy" rel="noreferrer">GitHub</a>
        <a href="https://github.com/dourgey/BandBuddy/issues" rel="noreferrer">问题反馈</a>
        <a href="https://github.com/dourgey/BandBuddy/blob/main/LICENSE" rel="noreferrer">Apache-2.0</a>
      </nav>
      <p>BandBuddy · Local-first practice workstation for musicians.</p>
    </div>
  </footer>

</html>
