server {
    listen 80;
    server_name bandbuddy.cn www.bandbuddy.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://bandbuddy.cn$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.bandbuddy.cn;
    ssl_certificate /etc/nginx/ssl/host-letsencrypt/live/bandbuddy.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/host-letsencrypt/live/bandbuddy.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://bandbuddy.cn$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name bandbuddy.cn;
    root /usr/share/nginx/html/bandbuddy/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    ssl_certificate /etc/nginx/ssl/host-letsencrypt/live/bandbuddy.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/host-letsencrypt/live/bandbuddy.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BandBuddyTLS:10m;
    ssl_session_timeout 1d;
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    location = /favicon.ico { try_files /assets/icon.png =404; }
    location ~ /\. { deny all; }
    location / {
        etag on;
        expires -1;
        try_files $uri $uri/ =404;
    }
}
